date.timezone = Europe/Madrid
expose_php = Off
display_errors = Off
log_errors = On
; Los errores van a stderr del contenedor: docker logs fa-test-web
error_log = /dev/stderr
; CVE-2026-115560 (PHP, 23-10-2026): medida provisional que recomienda Hostinger (igual que los demás TEST)
session.upload_progress.enabled = Off
